worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    # PERF: Compress text assets in production to reduce transfer size and improve TTFB on slow links.
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml text/xml application/xml+rss image/svg+xml;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_max_body_size 10m;

    # SECURITY: Keep writable temporary paths under /tmp so Nginx can run as an unprivileged user.
    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;
        root /var/www/html/public;
        index index.php index.html;

        # SECURITY: Harden browser behaviour for both static and dynamic responses served by Nginx.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

        location ^~ /build/ {
            # PERF: Cache fingerprinted Vite bundles aggressively because every deploy changes their filenames.
            expires max;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        location ~* \.(?:css|gif|ico|jpeg|jpg|js|png|svg|webp|woff2?)$ {
            # PERF: Cache static assets aggressively to avoid repeat downloads across navigations.
            expires max;
            add_header Cache-Control "public, max-age=31536000, immutable";
            log_not_found off;
        }
    }
}
