services:
  - type: web
    name: suztech-web
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /up
    envVars:
      # PROD: Help Render target the Nginx listener inside the Docker container.
      - key: PORT
        value: "10000"
      # PROD: Core Laravel runtime settings for the web service.
      - key: APP_NAME
        value: SUZTECH
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr
      - key: APP_MAINTENANCE_DRIVER
        value: file
      # PROD: Send container logs to stderr so Render captures them automatically.
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_STACK
        value: stderr
      - key: LOG_LEVEL
        value: info
      # PROD: Use the external Aiven MySQL service managed outside Render.
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # PROD: Keep Laravel stateful subsystems explicit for Render containers.
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_DOMAIN
        value: "null"
      - key: QUEUE_CONNECTION
        value: sync
      - key: BROADCAST_CONNECTION
        value: log
      # PROD: Route product media to Cloudinary instead of ephemeral local storage.
      - key: FILESYSTEM_DISK
        value: cloudinary
      - key: CLOUDINARY_URL
        sync: false
      # PROD: Configure transactional email delivery for account and contact flows.
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_SCHEME
        value: tls
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: no-reply@suztech.bj
      - key: MAIL_FROM_NAME
        value: SUZTECH
      # PROD: Surface non-secret frontend values during the Docker build.
      - key: VITE_APP_NAME
        value: SUZTECH
      - key: VITE_FORMSPREE_URL
        sync: false
