services:
  - type: web
    name: suztech-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /up
    envVars:
      # PROD: Core Laravel runtime settings required for a secure Render deployment.
      - key: APP_NAME
        value: SUZTECH
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: "CHANGE_ME"
      - key: APP_URL
        value: https://CHANGE_ME.onrender.com
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr
      - key: APP_MAINTENANCE_DRIVER
        value: file
      # PROD: Send container logs to stderr so Render captures them automatically.
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_STACK
        value: stderr
      - key: LOG_LEVEL
        value: info
      # PROD: Use MySQL settings supplied by your production database provider.
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: "CHANGE_ME"
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        value: "CHANGE_ME"
      - key: DB_USERNAME
        value: "CHANGE_ME"
      - key: DB_PASSWORD
        value: "CHANGE_ME"
      # PROD: Keep Laravel stateful subsystems explicit for Render containers.
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_DOMAIN
        value: "CHANGE_ME"
      - key: QUEUE_CONNECTION
        value: sync
      - key: BROADCAST_CONNECTION
        value: log
      # PROD: Route product media to Cloudinary instead of ephemeral local storage.
      - key: FILESYSTEM_DISK
        value: cloudinary
      - key: CLOUDINARY_URL
        value: "CHANGE_ME"
      # PROD: Configure transactional email delivery for account and contact flows.
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_SCHEME
        value: tls
      - key: MAIL_HOST
        value: "CHANGE_ME"
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: "CHANGE_ME"
      - key: MAIL_PASSWORD
        value: "CHANGE_ME"
      - key: MAIL_FROM_ADDRESS
        value: no-reply@suztech.bj
      - key: MAIL_FROM_NAME
        value: SUZTECH
      # PROD: Surface the Formspree endpoint to the Vite frontend at build time.
      - key: VITE_APP_NAME
        value: SUZTECH
      - key: VITE_FORMSPREE_URL
        value: "CHANGE_ME"
